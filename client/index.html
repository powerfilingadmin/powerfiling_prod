    <!--
      SEO NOTE
      Tags marked data-rh="true" are DEFAULTS for the homepage / non-JS crawlers.
      react-helmet-async (components/RouteSEO.jsx) replaces them on every route,
      so inner pages never inherit the homepage title, description or canonical.
      A static build step (scripts/generate-static-seo.mjs) also writes
      page-specific copies of this file into dist/ for crawlers that skip JS.
    -->
    <meta data-rh="true" name="description" content="File your income tax return online with CA-reviewed ITR filing for salary, capital gains, F&O, crypto, business and NRI income. Simple, secure and accurate." />
    <meta name="author" content="PowerFiling" />
    <meta data-rh="true" name="robots" content="index, follow" />
    <link data-rh="true" rel="canonical" href="https://powerfiling.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:site_name" content="PowerFiling" />
    <meta property="og:locale" content="en_IN" />

    <meta property="og:image:width" content="1200" />
